# Install on ikon (public edge), not on N4020.
#
# Example:
#   sudo cp nginx/homelab-api.gogirlabs.uk.conf /etc/nginx/sites-available/api.gogirlabs.uk
#   sudo ln -sf /etc/nginx/sites-available/api.gogirlabs.uk /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d api.gogirlabs.uk   # if certs not yet present
#   sudo nginx -t && sudo systemctl reload nginx
#
# Upstream is gogir-server LAN IP (reachable from ikon via WireGuard → Pi → LAN).

upstream gogirlabs_homelab_backend {
    server 192.168.0.21:8001;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.gogirlabs.uk;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.gogirlabs.uk;

    # Let's Encrypt (adjust paths if certbot used a different name)
    ssl_certificate     /etc/letsencrypt/live/api.gogirlabs.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.gogirlabs.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    client_max_body_size 20M;

    # API + admin + media/static via Django/WhiteNoise (or Django media views)
    location / {
        proxy_pass http://gogirlabs_homelab_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
